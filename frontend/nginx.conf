# --- Rate limiting (edge layer) -----------------------------------------
# Per-client-IP shared-memory zones. Django enforces finer application-level
# limits (login/register/write throttles); this layer drops floods before
# they ever reach the backend.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Query strings are redacted: signed document-download tokens travel in
# ?token= and must not persist in access logs.
log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method '
                    '$uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log redacted;

    # Cap request bodies (uploads go to the API, not here) so nginx rejects
    # oversized payloads before they are buffered.
    client_max_body_size 6m;

    # Report 429 (not the default 503) when the rate/connection limits trip.
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn perip 30;

    # Do not advertise the nginx version in headers/error pages.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Basic security headers for the SPA origin.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Same-origin API + media proxy: the SPA and backend share this origin,
    # so no CORS is needed and the refresh cookie stays same-site.
    # The upstream name matches the backend service in docker-compose.yml.
    # The variable + resolver form defers DNS lookup to request time, so this
    # image still STARTS when deployed standalone (set VITE_API_URL at build
    # time there and the SPA talks to the API cross-origin instead).
    # Credential endpoints (login/register/refresh/logout) get the strictest
    # limits: this is the brute-force surface.
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;  # Docker built-in DNS
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        # $http_host (not $host): preserves the client's port so the
        # backend's same-origin Origin check works on non-standard ports.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ${XFP} is rendered by the nginx image's envsubst templating from the
        # XFP env var: "$scheme" when nginx is the edge, "$http_x_forwarded_proto"
        # behind the Caddy TLS profile.
        proxy_set_header X-Forwarded-Proto ${XFP};
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;  # Docker built-in DNS
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${XFP};
    }
    location /media/ {
        limit_req zone=api burst=40 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $media_upstream http://backend:8000;
        proxy_pass $media_upstream;
        proxy_set_header Host $http_host;
    }

    # Django admin + its static assets (WhiteNoise). Strict auth-zone limit:
    # the staff login form is a brute-force surface.
    location /admin/ {
        limit_req zone=auth burst=5 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${XFP};
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    location /static/ {
        limit_req zone=api burst=40 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # Hashed build assets: cache aggressively.
    location /assets/ {
        expires 1y;
        # add_header is NOT inherited once a location defines its own, so
        # re-declare the security headers here alongside the cache header.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: never cache the HTML shell.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
