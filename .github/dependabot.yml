version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    commit-message:
      prefix: deps(backend)
    groups:
      django:
        patterns: [django, djangorestframework*]
      minor-patch:
        update-types: [minor, patch]

  # Frontend deps are managed with Bun (bun.lock). Dependabot has no
  # bun.lock support, so frontend updates are handled manually via
  # `bun update` / `bun outdated` until Dependabot adds support.

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    commit-message:
      prefix: deps(docker)

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    commit-message:
      prefix: deps(docker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
