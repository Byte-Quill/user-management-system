name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgres://kyc:kyc@localhost:5432/kyc"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: kyc
          POSTGRES_DB: kyc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyc -d kyc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.7 pip-audit==2.10.1
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Audit dependencies (pip-audit)
        run: pip-audit --strict -r requirements.txt
      - name: Django system check
        run: python manage.py check
        env:
          DJANGO_DEBUG: "true"
      - name: Migration drift check
        # Fails when models and migrations disagree (issue #29 added a new
        # migration — this keeps that drift from silently sneaking back).
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "true"
      - name: Django system check (production settings)
        # Exercised with DEBUG=false so production-only behavior (CSP, HSTS,
        # secure cookies, secret-key enforcement, deploy checks) is validated
        # in CI. GOOGLE_CLIENT_ID is set so the Google-enabled CSP directive
        # set (issue #24) is actually built and checked here.
        run: python manage.py check --deploy
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-random-key-0123456789abcdef0123456789abcdef012345"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          GOOGLE_CLIENT_ID: "ci-google-client-id"
      - name: Run tests (development settings)
        run: python manage.py test kyc
        env:
          DJANGO_DEBUG: "true"
      - name: Run tests (production settings)
        # The debug-mode run above cannot catch DEBUG=false-only regressions
        # (CSP middleware, secure cookies, SECRET_KEY guard). This second run
        # executes the whole suite with production settings. SECURE_SSL_REDIRECT
        # is disabled so the test client is not 301-bounced to https; the Django
        # test runner appends testserver to ALLOWED_HOSTS automatically.
        run: python manage.py test kyc
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-random-key-0123456789abcdef0123456789abcdef012345"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          DJANGO_SECURE_SSL_REDIRECT: "false"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test (bun test)
        run: bun test
      - name: Audit dependencies (bun audit)
        run: bun audit --omit=dev --audit-level=high
      - name: Type-check + build
        run: bun run build
