name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: kyc
          POSTGRES_DB: kyc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyc -d kyc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt ruff pip-audit
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Audit dependencies (pip-audit)
        run: pip-audit --strict -r requirements.txt
      - name: Django system check
        run: python manage.py check
        env:
          DJANGO_DEBUG: "true"
          DATABASE_URL: "postgres://kyc:kyc@localhost:5432/kyc"
      - name: Run tests
        run: python manage.py test kyc
        env:
          DJANGO_DEBUG: "true"
          DATABASE_URL: "postgres://kyc:kyc@localhost:5432/kyc"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test (bun test)
        run: bun test
      - name: Audit dependencies (bun audit)
        run: bun audit --omit=dev --audit-level=high
      - name: Type-check + build
        run: bun run build
