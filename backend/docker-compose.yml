# 100% free, self-hosted stack: PostgreSQL + Django + nginx (SPA + /api proxy).
#
#   cd backend && docker compose up --build
#
# Then open http://localhost:8080 (SPA + API on the same origin, so no CORS
# and no VITE_API_URL needed). Documents live in the `media_data` volume.
#
# Production notes:
#   - Set a strong DJANGO_SECRET_KEY (never ship the default).
#   - Put TLS in front (e.g. Caddy) and drop DJANGO_SECURE_SSL_REDIRECT=false
#     only if the proxy already forces HTTPS; otherwise keep the default.
#   - Back up Postgres (docker compose exec db pg_dump -U kyc kyc > backup.sql)
#     and the media_data volume.

services:
  db:
    # PostgreSQL 18 — latest stable major release (supported until Nov 2030).
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kyc
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kyc
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d kyc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # This compose file lives in backend/, so the build context is "." here
    # and "../frontend" for the SPA image.
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://kyc:kyc@db:5432/kyc
      # Plain HTTP behind nginx: Secure cookies/HSTS/redirects would break.
      DJANGO_SECURE_SSL_REDIRECT: "false"
      # Same-origin deployment: no cross-origin requests, so no CORS origins
      # are required (the refresh cookie is same-site).
      CORS_ALLOWED_ORIGINS: ""
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pg_data:
  media_data:
