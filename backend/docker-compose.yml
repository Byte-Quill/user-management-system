# 100% free, self-hosted stack: PostgreSQL + Django + nginx (SPA + /api proxy).
#
#   cd backend && docker compose up --build
#
# Then open http://localhost:8080 (SPA + API on the same origin, so no CORS
# and no VITE_API_URL needed).
#
# Production notes:
#   - Set a strong DJANGO_SECRET_KEY and POSTGRES_PASSWORD (no defaults).
#   - This base stack is PLAIN HTTP and binds to 127.0.0.1 only. Anything
#     beyond localhost must use the TLS profile (docker-compose.tls.yml),
#     which adds a Caddy edge and switches Django to HTTPS mode.
#   - Back up Postgres and the media_data volume.

services:
  db:
    # PostgreSQL 18 — latest stable major release (supported until Nov 2030).
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kyc
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (strong random value)}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d kyc"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  backend:
    # This compose file lives in backend/, so build contexts are "." here
    # and "../frontend" for the SPA image.
    build: .
    restart: unless-stopped
    environment:
      # Fail fast instead of booting with a publicly-known default key.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a strong DJANGO_SECRET_KEY (50+ random chars)}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://kyc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (strong random value)}@db:5432/kyc
      # Plain HTTP behind nginx: Secure cookies/HSTS/redirects would break.
      DJANGO_SECURE_SSL_REDIRECT: "false"
      # Same-origin deployment: the refresh cookie is same-site, so no CORS.
      CORS_ALLOWED_ORIGINS: ""
      # Google Sign-In (optional): OAuth "Web application" client ID.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Transactional email (signup OTP, password reset) via Resend.
      # Unset falls back to the console backend (DEBUG only); verify a
      # sending domain in Resend first.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Login Portal <onboarding@resend.dev>}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /readyz returns 503 when the DB is down; urllib raises on it.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  web:
    build:
      context: ../frontend
      args:
        # Must match the backend's GOOGLE_CLIENT_ID; empty disables the button.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      # nginx.conf is a template: XFP renders the X-Forwarded-Proto value sent
      # to the backend. nginx is the edge here, so it is our own scheme.
      XFP: "$$scheme"
      # Only substitute XFP; leave nginx's own $variables untouched.
      NGINX_ENVSUBST_FILTER: XFP
    ports:
      # Loopback only: this stack is plain HTTP (no Secure cookies/HSTS), so
      # exposing it on all interfaces would put cleartext session cookies and
      # KYC PII on the network. Remote access goes through the TLS profile.
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  pg_data:
  media_data:
